name: Build

# On every push and pull request: run the tests, build VolumeMixer.exe on
# Windows, and run the finished exe's self-test on that Windows machine.
# Publishing a release on GitHub (which creates a tag like v2.1.0) does the
# same and then attaches the exe to the release, but only if the self-test
# passed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the exe to a release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Stamp the version
        shell: bash
        run: |
          # A release tag v2.1.0 becomes version 2.1.0 inside the app.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "__version__ = \"$v\"" > src/volume_mixer/_version.py
          echo "Version: $v"

      - name: Build VolumeMixer.exe
        run: pyinstaller VolumeMixer.spec --noconfirm

      # The build machine has no sound card. A virtual one (VB-Audio Cable,
      # installed on this throwaway machine only) and an app playing a sound
      # let the self-test exercise the device and app controls for real.
      - name: Add a virtual sound card
        continue-on-error: true
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4

      - name: Play a sound in the background
        continue-on-error: true
        shell: pwsh
        run: |
          Start-Service audiosrv -ErrorAction SilentlyContinue
          $wav = Get-ChildItem "$env:WINDIR\Media\*.wav" | Select-Object -First 1
          if ($wav) {
            $cmd = "`$p = New-Object System.Media.SoundPlayer '$($wav.FullName)'; `$p.PlayLooping(); Start-Sleep 300"
            Start-Process pwsh -ArgumentList "-NoProfile", "-Command", $cmd -WindowStyle Hidden
            Start-Sleep 3
            Write-Output "Playing $($wav.Name)"
          }

      - name: Self-test the exe on Windows
        shell: pwsh
        timeout-minutes: 5
        run: |
          $log = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\VolumeMixer.exe" -ArgumentList "--self-test", $log -PassThru -Wait
          if (Test-Path $log) { $lines = @(Get-Content $log -Encoding utf8) }
          else { $lines = @("Self-test FAILED", "ERROR: the exe wrote no result (exit code $($p.ExitCode))") }
          $lines | ForEach-Object { Write-Output $_ }
          $size = [math]::Round((Get-Item "dist\VolumeMixer.exe").Length / 1MB, 1)
          $audio = ($lines | Where-Object { $_ -match '^INFO: \d+ (output|app)' }) -replace '^INFO: ', '' -join ' | '
          $passed = @($lines | Where-Object { $_ -like 'INFO: ok:*' }).Count
          $skipped = ($lines | Where-Object { $_ -match 'not checked' }) -replace '^(INFO|WARNING): ', '' -join ' | '
          Write-Output "::notice title=Self-test::$($lines[0]) | $passed checks passed | exe $size MB | $audio | $skipped"
          function Escape($t) { $t -replace '%', '%25' }
          $lines | Where-Object { $_ -like 'ERROR:*' } | Select-Object -First 9 |
            ForEach-Object { Write-Output "::error title=Self-test::$(Escape $_)" }
          $lines | Where-Object { $_ -like 'WARNING:*' } | Select-Object -First 5 |
            ForEach-Object { Write-Output "::warning title=Self-test::$(Escape $_)" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: VolumeMixer-windows
          path: dist/VolumeMixer.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/VolumeMixer.exe
          generate_release_notes: true
